id: odoo-project-task-001
environment: odoo17
surface: web
start_url: http://127.0.0.1:8069/web/login
login: odoo_admin
seed: baseline
instruction: >
  In Odoo Project, open the task "Meeting Room Furnitures" in the Office Design
  project, mark it as done, and log the note "Reviewed by bench" on it.
max_steps: 40
max_cost_usd: 0.50
forbidden_screens: ["res.config.settings", "ir.module.module"]
expected:
  db:
    - query: "select state from project_task where id = 9"
      equals: "1_done"
    - query: "select count(*) from mail_message where model = 'project.task' and res_id = 9 and body like '%Reviewed by bench%'"
      equals: 1
  ui: []
  files: []
